<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sube tus fotos y vídeos de la boda de Gloria y José">
<link rel="icon" type="image/png" href="img/favicon.png">
<title>Subir Fotos · Boda Gloria y José</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --emerald: #1a382b;
    --emerald-dark: #12281e;
    --gold: #c9a063;
    --gold-light: #e2c290;
    --gold-dark: #9e773b;
    --bg-cream: #fbf9f4;
    --dark-text: #231f1a;
    --muted-text: #7a7267;
    --border-gold: rgba(201, 160, 99, 0.35);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #ebe6da;
    color: var(--dark-text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: var(--bg-cream);
    border-radius: 20px;
    border: 1px solid var(--border-gold);
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    padding: 2.5rem 1.8rem;
    text-align: center;
  }
  h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    color: var(--emerald);
    font-weight: 600;
    letter-spacing: 0.03em;
    margin-bottom: 0.6rem;
  }
  p {
    font-size: 0.88rem;
    color: var(--muted-text);
    line-height: 1.6;
    margin-bottom: 1.8rem;
  }
  .btn-gold {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
    padding: 0.95rem 2.2rem;
    background: linear-gradient(135deg, var(--emerald) 0%, var(--emerald-dark) 100%);
    color: var(--gold-light);
    border: 1px solid var(--gold);
    border-radius: 50px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(26, 56, 43, 0.22);
    transition: all 0.3s ease;
  }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(26, 56, 43, 0.32); color: #ffffff; }
  .btn-gold.is-disabled {
    background: linear-gradient(135deg, #8f8a7c 0%, #726d61 100%);
    color: #f1ede3;
    cursor: not-allowed;
    box-shadow: none;
  }
  .btn-gold.is-disabled:hover { transform: none; box-shadow: none; color: #f1ede3; }
</style>
</head>
<body>
  <div class="card">
    <h1>Gloria &amp; José</h1>
    <p>Comparte con nosotros tus fotos y vídeos del gran día.</p>
    <button class="btn-gold" id="upload-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg> <span id="upload-btn-label">Subir Fotos y Vídeos</span>
    </button>
    <input type="file" id="upload-input" multiple accept="image/*,video/*" style="display:none">
  </div>

  <script src="js/upload.js"></script>
  <script>
    const uploadActive = Date.now() >= new Date('2027-07-31T00:00:00').getTime();
    const btn = document.getElementById('upload-btn');
    const btnLabel = document.getElementById('upload-btn-label');
    if (!uploadActive) {
      btn.classList.add('is-disabled');
      btnLabel.textContent = 'Disponible el día de la boda';
    }
    initUploadFlow({
      buttonId: 'upload-btn',
      inputId: 'upload-input',
      labelId: 'upload-btn-label',
      isActive: () => uploadActive,
      lockedMessage: '¡Esta sección se activará el día de la boda (31 de julio de 2027)! Guardad vuestras fotos y compartidlas con nosotros ese día. 💍'
    });
  </script>
</body>
</html>
